[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Home Assistant's own convention: multi-import `from x import a as a, b as b`
# style in coordinator.py, and `Any` on the habluetooth adapter boundary.
ignore = ["B008"]

[tool.ruff.lint.isort]
# Home Assistant's own convention: `homeassistant` is its own import section,
# between third-party and this integration's relative imports.
known-first-party = ["homeassistant"]
# `esphome/components/bluesight/` is firmware source that ESPHome compiles from
# its own installation; it is not a package this repository provides. Without
# this, ruff's src detection sees the `esphome/` directory at the repo root,
# decides `esphome` is first-party, and splits the ESPHome imports across two
# sections — an artefact of our directory layout, not of the code.
known-third-party = ["esphome"]

[tool.ruff.lint.per-file-ignores]
# Tests import the module under test after an `importorskip` guard, which has
# to run before the import can succeed; and their throwaway fakes are allowed
# long assertion lines and plain mutable class attributes.
"tests/*" = ["E402", "E501", "RUF012", "RUF059"]
# One-off asset generator, not shipped with the integration.
"scripts/*" = ["RUF005", "B905"]

[tool.pytest.ini_options]
# Run pytest from the repo root; make the repo importable so that
# `custom_components.bluesight...` resolves without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
# pytest-homeassistant-custom-component ships autouse *async* fixtures (e.g.
# `enable_event_loop_debug`). Under pytest-asyncio's default STRICT mode a sync
# test depending on an async autouse fixture errors out, which breaks the whole
# suite once the HA plugin is loaded (CI/Linux). `auto` mode is what phcc
# expects and lets those fixtures apply cleanly; it is inert for the pure sync
# tests on Windows where the plugin is disabled.
asyncio_mode = "auto"
# The foundation tests (model, detectors, windows, policy, entity logic) are
# pure Python, but they cannot be *imported* without Home Assistant: they reach
# `custom_components.bluesight.<module>`, which runs the package's
# `__init__.py`, which imports `homeassistant.*` at module scope. On a machine
# without HA installed, `tests/conftest.py` stubs exactly those imports and says
# so in the pytest header; where HA is installed (CI/Linux) the stub does not
# engage at all. See the module docstring there.
#
# Separately, the `pytest-homeassistant-custom-component` plugin registers an
# autoloaded pytest11 entrypoint named "homeassistant" that imports the HA
# runner at collection time; on non-Linux dev machines that import fails
# (e.g. the Unix-only `fcntl` module), which would otherwise block collection
# of these tests. Disable that autoload here so the suite always runs under
# plain pytest. HA-dependent tests re-enable it via their own invocation on
# Linux/CI.
addopts = "-p no:homeassistant"
