name: Feature request
description: Suggest a capability this integration does not have yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: BlueSight only reports what Home Assistant and the proxies already expose. A request that needs a counter no proxy measures cannot be built here.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal, not only the feature. The best solution is often not the one first imagined.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: Entity, service, option, ESPHome configuration - whatever form you have in mind.
    validations:
      required: false
  - type: textarea
    id: hardware
    attributes:
      label: Can you test it?
      description: |
        Say what your setup looks like -- a failure mode is only fixable once it can be reproduced on someone's proxies.
    validations:
      required: false
